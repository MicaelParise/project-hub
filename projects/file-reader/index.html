<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>File Reader :: MicaelParise</title>

	<script>
		(function () {
			var salvo = localStorage.getItem('tema');
			var escuro = salvo ? salvo === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
			document.documentElement.classList.toggle('dark', escuro);
		})();
	</script>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			darkMode: 'class',
			theme: {
				extend: {
					colors: {
						term: {
							bg: 'var(--term-bg)',
							alt: 'var(--term-bg-alt)',
							fg: 'var(--term-fg)',
							dim: 'var(--term-fg-dim)',
							accent: 'var(--term-accent)',
							border: 'var(--term-border)',
							soft: 'var(--term-fg-soft)',
							toggle: 'var(--term-toggle-bg)',
						},
					},
					fontFamily: {
						mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
						display: ['"Share Tech Mono"', 'ui-monospace', 'monospace'],
					},
				},
			},
		};
	</script>

	<link rel="stylesheet" href="../../assets/css/style.css">
	<link rel="stylesheet" href="css/styles.css">
	<script src="../../assets/js/app.js" defer></script>
	<script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body class="min-h-screen bg-term-bg text-term-fg font-mono js-transicao">
<div class="scanlines" aria-hidden="true"></div>

	<header class="fixed inset-x-0 top-0 z-40 border-b border-term-border bg-term-bg/80 backdrop-blur-md">
		<div class="mx-auto flex max-w-6xl items-center gap-3 px-4 py-4 md:px-8">
			<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="h-8 w-8 shrink-0 text-term-accent">
				<path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6M9 8h1M6.75 3h6.379a1.5 1.5 0 0 1 1.06.44l3.371 3.37a1.5 1.5 0 0 1 .44 1.061V19.5A1.5 1.5 0 0 1 16.5 21h-9.75A1.5 1.5 0 0 1 5.25 19.5v-15A1.5 1.5 0 0 1 6.75 3Z" />
			</svg>
			<div>
				<h1 class="text-lg font-bold leading-tight">File Reader</h1>
				<p class="hidden text-xs text-term-dim sm:block">Visualize o conteúdo de arquivos de texto direto no navegador</p>
			</div>
		</div>
	</header>

	<main x-data="leitorArquivos()" class="mx-auto flex min-h-screen max-w-6xl flex-col justify-center px-4 pb-16 pt-28 md:px-8">
		<div class="grid gap-6 md:grid-cols-2 md:gap-8 md:items-start">

			<section class="space-y-5">
				<div
					class="group card-frame flex cursor-pointer flex-col items-center justify-center gap-3 rounded-xl border border-dashed border-term-border bg-term-alt p-10 text-center js-transicao"
					:class="arrastando ? 'border-term-accent' : ''"
					@click="$refs.entrada.click()"
					@dragover.prevent="arrastando = true"
					@dragleave.prevent="arrastando = false"
					@drop.prevent="soltarArquivo($event)"
				>
					<input x-ref="entrada" type="file" class="hidden" accept=".txt,.md,.html,.css,.js" @change="selecionarArquivo($event)">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="h-10 w-10 text-term-accent">
						<path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 8.25 12 3.75m0 0L7.5 8.25M12 3.75v13.5" />
					</svg>
					<div>
						<p class="font-semibold">Clique ou arraste um arquivo aqui</p>
						<p class="text-sm text-term-dim">.txt, .md, .html, .css ou .js</p>
					</div>
				</div>

				<div class="flex items-center gap-4 card-frame rounded-xl border border-term-border bg-term-alt p-5">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="h-9 w-9 shrink-0 text-term-dim">
						<path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
					</svg>
					<div class="min-w-0 flex-1">
						<p class="text-sm text-term-dim">Arquivo selecionado</p>
						<p class="truncate font-semibold" x-text="nomeArquivo || 'Nenhum arquivo selecionado'"></p>
					</div>
					<button
						x-show="arquivoSelecionado" x-cloak
						@click="limpar()"
						class="shrink-0 rounded-lg border border-term-border px-3 py-1.5 text-sm font-medium text-term-dim hover:border-term-accent hover:text-term-accent js-transicao"
					>
						Limpar
					</button>
				</div>

				<div
					x-show="erro" x-cloak x-transition
					class="rounded-xl border border-red-500/50 bg-term-alt p-4 text-sm font-medium text-red-500"
				>
					<span x-text="erro"></span>
				</div>
			</section>

			<section class="flex h-full flex-col overflow-hidden card-frame rounded-xl border border-term-border bg-term-alt md:sticky md:top-28">
				<div class="flex items-center gap-2 border-b border-term-border px-5 py-3">
					<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="h-5 w-5 text-term-dim">
						<path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75 22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3-4.5 16.5" />
					</svg>
					<span class="font-semibold">Conteúdo</span>
				</div>
				<div class="max-h-[65vh] overflow-auto p-5">
					<template x-if="!arquivoSelecionado">
						<p class="text-sm text-term-dim">O conteúdo do arquivo aparecerá aqui.</p>
					</template>
					<pre x-show="arquivoSelecionado" x-cloak class="whitespace-pre-wrap break-words font-mono text-sm text-term-fg" x-text="conteudo"></pre>
				</div>
			</section>

		</div>
	</main>

	<a
		href="../../index.html"
		aria-label="Voltar para o hub de projetos"
		class="fixed bottom-6 right-20 z-[1000] w-12 h-12 rounded-full border border-term-border bg-term-toggle backdrop-blur flex items-center justify-center shadow-lg text-term-fg hover:text-term-accent hover:border-term-accent transition-colors"
	>
		<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-6h5v6"/></svg>
	</a>

	<button
		type="button"
		x-data="themeToggle()"
		x-on:click="toggle()"
		class="theme-toggle fixed bottom-6 right-6 z-[1000] w-12 h-12 rounded-full border border-term-accent bg-term-toggle backdrop-blur flex items-center justify-center shadow-lg text-term-accent hover:text-glow"
		aria-label="Alternar entre tema claro e escuro"
	>
		<svg class="icon-sun w-5 h-5" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.7"/><g stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="4.4" y1="4.4" x2="6.1" y2="6.1"/><line x1="17.9" y1="17.9" x2="19.6" y2="19.6"/><line x1="4.4" y1="19.6" x2="6.1" y2="17.9"/></g></svg>
		<svg class="icon-moon w-5 h-5" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg>
	</button>

	<script src="js/app.js"></script>
</body>
</html>
