<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Reader :: MicaelParise</title>
  <meta name="description" content="Visualize o conteúdo de arquivos de texto direto no navegador.">

  <!-- tema salvo aplicado antes da primeira pintura (sincrono, evita flash) -->
  <script src="../../assets/js/tema.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="../../assets/js/tailwind-tema.js"></script>

  <link rel="stylesheet" href="../../assets/css/style.css">

  <!-- scripts com defer executam em ordem: compartilhado, projeto e por ultimo o Alpine -->
  <script src="../../assets/js/app.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
</head>
<body class="min-h-screen bg-term-bg text-term-fg font-mono antialiased">
  <div class="scanlines" aria-hidden="true"></div>

  <header class="fixed inset-x-0 top-0 z-40 border-b border-term-border bg-term-bg/80 backdrop-blur-md">
    <div class="mx-auto flex max-w-6xl items-center gap-3 px-4 py-4 md:px-8">
      <!-- heroicons: document-text -->
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-8 w-8 shrink-0 text-term-accent" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
      </svg>
      <div>
        <h1 class="font-display text-xl leading-tight text-term-accent text-glow">File Reader</h1>
        <p class="hidden text-xs text-term-dim sm:block">Visualize o conteúdo de arquivos de texto direto no navegador</p>
      </div>
    </div>
  </header>

  <main x-data="leitorArquivos()" class="mx-auto flex min-h-screen max-w-6xl flex-col justify-center px-4 pb-24 pt-28 md:px-8">
    <div class="grid gap-6 md:grid-cols-2 md:items-start md:gap-8">

      <section class="space-y-5">
        <div
          role="button"
          tabindex="0"
          aria-label="Selecionar arquivo de texto"
          class="card-frame group flex cursor-pointer flex-col items-center justify-center gap-3 rounded-xl border border-dashed bg-term-alt p-10 text-center transition-colors"
          :class="arrastando ? 'border-term-accent' : 'border-term-border'"
          @click="$refs.entrada.click()"
          @keydown.enter.prevent="$refs.entrada.click()"
          @keydown.space.prevent="$refs.entrada.click()"
          @dragover.prevent="arrastando = true"
          @dragleave.prevent="arrastando = false"
          @drop.prevent="soltarArquivo($event)"
        >
          <input x-ref="entrada" type="file" class="hidden" accept=".txt,.md,.html,.css,.js,text/*" @change="selecionarArquivo($event)">
          <!-- heroicons: arrow-up-tray -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-10 w-10 text-term-accent" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />
          </svg>
          <div>
            <p class="font-semibold">Clique ou arraste um arquivo aqui</p>
            <p class="text-sm text-term-dim">.txt, .md, .html, .css ou .js</p>
          </div>
        </div>

        <div class="card-frame flex items-center gap-4 rounded-xl border border-term-border bg-term-alt p-5">
          <!-- heroicons: document -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-9 w-9 shrink-0 text-term-dim" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
          </svg>
          <div class="min-w-0 flex-1">
            <p class="text-sm text-term-dim">Arquivo selecionado</p>
            <p class="truncate font-semibold" x-text="nomeArquivo || 'Nenhum arquivo selecionado'"></p>
          </div>
          <button
            type="button"
            x-show="arquivoSelecionado" x-cloak
            @click="limpar()"
            class="shrink-0 rounded-lg border border-term-border px-3 py-1.5 text-sm font-medium text-term-dim transition-colors hover:border-term-accent hover:text-term-accent"
          >
            Limpar
          </button>
        </div>

        <div
          x-show="erro" x-cloak x-transition
          role="alert"
          class="rounded-xl border border-term-danger/50 bg-term-alt p-4 text-sm font-medium text-term-danger"
        >
          <span x-text="erro"></span>
        </div>
      </section>

      <section class="card-frame flex h-full flex-col overflow-hidden rounded-xl border border-term-border bg-term-alt md:sticky md:top-28">
        <div class="flex items-center gap-2 border-b border-term-border px-5 py-3">
          <!-- heroicons: code-bracket -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5 text-term-dim" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 6.75 22.5 12l-5.25 5.25m-10.5 0L1.5 12l5.25-5.25m7.5-3-4.5 16.5" />
          </svg>
          <span class="font-semibold">Conteúdo</span>
        </div>
        <div class="max-h-[65vh] overflow-auto p-5">
          <p x-show="!arquivoSelecionado" class="text-sm text-term-dim">O conteúdo do arquivo aparecerá aqui.</p>
          <pre x-show="arquivoSelecionado" x-cloak class="whitespace-pre-wrap break-words font-mono text-sm text-term-fg" x-text="conteudo"></pre>
        </div>
      </section>

    </div>
  </main>
</body>
</html>
