<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronometer :: MicaelParise</title>

  <style>[x-cloak] { display: none !important; }</style>

  <script>
    (function () {
      var salvo = localStorage.getItem('tema');
      var escuro = salvo ? salvo === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', escuro);
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            term: {
              bg: 'var(--term-bg)',
              alt: 'var(--term-bg-alt)',
              fg: 'var(--term-fg)',
              dim: 'var(--term-fg-dim)',
              accent: 'var(--term-accent)',
              border: 'var(--term-border)',
              soft: 'var(--term-fg-soft)',
              toggle: 'var(--term-toggle-bg)',
            },
          },
          fontFamily: {
            mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            display: ['"Share Tech Mono"', 'ui-monospace', 'monospace'],
          },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="css/styles.css">

  <script src="../../assets/js/app.js" defer></script>
  <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body class="min-h-screen font-mono bg-term-bg text-term-fg antialiased overflow-x-hidden transition-colors duration-300">

<div class="scanlines" aria-hidden="true"></div>

  <main class="min-h-screen flex flex-col items-center justify-center gap-8 px-4 py-10 sm:py-16">

    <header class="text-center">
      <p class="text-term-dim text-sm sm:text-base">visitante@micaelparise:~$ cronometer --start</p>
      <h1 class="font-display text-3xl sm:text-4xl mt-2 text-term-accent text-glow">
        Cronometer<span class="cursor-blink" aria-hidden="true">&nbsp;</span>
      </h1>
      <p class="mt-4 text-sm text-term-dim">Meça o tempo com precisão de centésimos</p>
    </header>

    <section x-data="cronometro()" class="w-full max-w-md flex flex-col items-center gap-6">

      <div class="card-frame w-full border border-term-border bg-term-alt rounded-xl px-4 py-8 sm:px-8 sm:py-10">

        <div class="flex items-center justify-center gap-1.5 mb-4 h-5" x-cloak>
          <template x-if="rodando">
            <span class="flex items-center gap-2 text-xs font-medium text-term-accent">
              <span class="w-2 h-2 rounded-full bg-term-accent animate-pulse"></span>
              Em execução
            </span>
          </template>
          <template x-if="!rodando && decorridoAcumulado > 0">
            <span class="text-xs font-medium text-term-dim">Pausado</span>
          </template>
          <template x-if="!rodando && decorridoAcumulado === 0">
            <span class="text-xs font-medium text-term-dim">Pronto para iniciar</span>
          </template>
        </div>

        <div class="flex items-end justify-center select-none">
          <div class="flex flex-col items-center">
            <span class="font-display text-4xl sm:text-6xl text-term-accent text-glow tabular-nums" x-text="horas">00</span>
            <span class="hidden sm:block mt-1 text-[10px] uppercase tracking-widest text-term-dim">horas</span>
          </div>
          <span class="font-display text-4xl sm:text-6xl text-term-border pb-0 sm:pb-4">:</span>
          <div class="flex flex-col items-center">
            <span class="font-display text-4xl sm:text-6xl text-term-accent text-glow tabular-nums" x-text="minutos">00</span>
            <span class="hidden sm:block mt-1 text-[10px] uppercase tracking-widest text-term-dim">min</span>
          </div>
          <span class="font-display text-4xl sm:text-6xl text-term-border pb-0 sm:pb-4">:</span>
          <div class="flex flex-col items-center">
            <span class="font-display text-4xl sm:text-6xl text-term-accent text-glow tabular-nums" x-text="segundos">00</span>
            <span class="hidden sm:block mt-1 text-[10px] uppercase tracking-widest text-term-dim">seg</span>
          </div>
          <span class="font-display text-4xl sm:text-6xl text-term-border pb-0 sm:pb-4">:</span>
          <div class="flex flex-col items-center">
            <span class="font-display text-4xl sm:text-6xl text-term-accent text-glow tabular-nums" x-text="centesimos">00</span>
            <span class="hidden sm:block mt-1 text-[10px] uppercase tracking-widest text-term-dim">ms</span>
          </div>
        </div>

      </div>

      <div class="w-full grid grid-cols-3 gap-3">
        <button
          @click="iniciar()"
          :disabled="rodando"
          class="card-frame flex flex-col items-center gap-1.5 rounded-xl border border-term-accent bg-term-accent text-term-bg shadow-md py-3 font-medium text-sm disabled:opacity-40 disabled:pointer-events-none transition-colors">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
          Iniciar
        </button>
        <button
          @click="pausar()"
          :disabled="!rodando"
          class="card-frame flex flex-col items-center gap-1.5 rounded-xl border border-term-border bg-term-alt text-term-fg shadow-md py-3 font-medium text-sm disabled:opacity-40 disabled:pointer-events-none hover:text-term-accent hover:border-term-accent transition-colors">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
          Pausar
        </button>
        <button
          @click="reiniciar()"
          class="card-frame flex flex-col items-center gap-1.5 rounded-xl border border-term-border bg-term-alt text-term-fg shadow-md py-3 font-medium text-sm hover:text-term-accent hover:border-term-accent transition-colors">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"></path><polyline points="3 4 3 9 8 9"></polyline></svg>
          Reiniciar
        </button>
      </div>

    </section>

  </main>

  <!-- VOLTAR PARA O HUB -->
  <a href="../../index.html" aria-label="Voltar para o hub de projetos"
     class="fixed bottom-6 right-20 z-[1000] w-12 h-12 rounded-full border border-term-border bg-term-toggle backdrop-blur flex items-center justify-center shadow-lg text-term-fg hover:text-term-accent hover:border-term-accent transition-colors">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-6h5v6"/></svg>
  </a>

  <!-- TOGGLE DE TEMA -->
  <button
    type="button"
    x-data="themeToggle()"
    x-on:click="toggle()"
    class="theme-toggle fixed bottom-6 right-6 z-[1000] w-12 h-12 rounded-full border border-term-accent bg-term-toggle backdrop-blur flex items-center justify-center shadow-lg text-term-accent hover:text-glow"
    aria-label="Alternar entre tema claro e escuro"
  >
    <svg class="icon-sun w-5 h-5" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.7"/><g stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="4.4" y1="4.4" x2="6.1" y2="6.1"/><line x1="17.9" y1="17.9" x2="19.6" y2="19.6"/><line x1="4.4" y1="19.6" x2="6.1" y2="17.9"/><line x1="17.9" y1="6.1" x2="19.6" y2="4.4"/></g></svg>
    <svg class="icon-moon w-5 h-5" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg>
  </button>

  <script src="js/app.js"></script>
</body>
</html>
