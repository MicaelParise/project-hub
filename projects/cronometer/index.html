<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronometer :: MicaelParise</title>
  <meta name="description" content="Cronômetro com precisão de centésimos, direto no navegador.">

  <!-- tema salvo aplicado antes da primeira pintura (sincrono, evita flash) -->
  <script src="../../assets/js/tema.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="../../assets/js/tailwind-tema.js"></script>

  <link rel="stylesheet" href="../../assets/css/style.css">

  <!-- scripts com defer executam em ordem: compartilhado, projeto e por ultimo o Alpine -->
  <script src="../../assets/js/app.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
</head>
<body class="min-h-screen overflow-x-hidden bg-term-bg text-term-fg font-mono antialiased">
  <div class="scanlines" aria-hidden="true"></div>

  <main class="flex min-h-screen flex-col items-center justify-center gap-8 px-4 pb-24 pt-10 sm:py-16">

    <header class="text-center">
      <p class="text-sm text-term-dim sm:text-base">visitante@micaelparise:~$ cronometer --start</p>
      <h1 class="mt-2 font-display text-3xl text-term-accent text-glow sm:text-4xl">
        Cronometer<span class="cursor-blink" aria-hidden="true">&nbsp;</span>
      </h1>
      <p class="mt-4 text-sm text-term-dim">Meça o tempo com precisão de centésimos</p>
    </header>

    <section x-data="cronometro()" class="flex w-full max-w-md flex-col items-center gap-6">

      <div class="card-frame w-full rounded-xl border border-term-border bg-term-alt px-4 py-8 sm:px-8 sm:py-10">

        <div class="mb-4 flex h-5 items-center justify-center" x-cloak aria-live="polite">
          <span x-show="rodando" class="flex items-center gap-2 text-xs font-medium text-term-accent">
            <span class="h-2 w-2 animate-pulse rounded-full bg-term-accent"></span>
            Em execução
          </span>
          <span x-show="!rodando" class="text-xs font-medium text-term-dim" x-text="decorridoAcumulado > 0 ? 'Pausado' : 'Pronto para iniciar'"></span>
        </div>

        <div class="flex select-none items-end justify-center" role="timer" :aria-label="`${horas}:${minutos}:${segundos}`">
          <div class="flex flex-col items-center">
            <span class="font-display text-4xl tabular-nums text-term-accent text-glow sm:text-6xl" x-text="horas">00</span>
            <span class="mt-1 hidden text-[10px] uppercase tracking-widest text-term-dim sm:block">horas</span>
          </div>
          <span class="pb-0 font-display text-4xl text-term-border sm:pb-4 sm:text-6xl" aria-hidden="true">:</span>
          <div class="flex flex-col items-center">
            <span class="font-display text-4xl tabular-nums text-term-accent text-glow sm:text-6xl" x-text="minutos">00</span>
            <span class="mt-1 hidden text-[10px] uppercase tracking-widest text-term-dim sm:block">min</span>
          </div>
          <span class="pb-0 font-display text-4xl text-term-border sm:pb-4 sm:text-6xl" aria-hidden="true">:</span>
          <div class="flex flex-col items-center">
            <span class="font-display text-4xl tabular-nums text-term-accent text-glow sm:text-6xl" x-text="segundos">00</span>
            <span class="mt-1 hidden text-[10px] uppercase tracking-widest text-term-dim sm:block">seg</span>
          </div>
          <span class="pb-0 font-display text-4xl text-term-border sm:pb-4 sm:text-6xl" aria-hidden="true">.</span>
          <div class="flex flex-col items-center">
            <span class="font-display text-4xl tabular-nums text-term-accent text-glow sm:text-6xl" x-text="centesimos">00</span>
            <span class="mt-1 hidden text-[10px] uppercase tracking-widest text-term-dim sm:block">cent</span>
          </div>
        </div>

      </div>

      <div class="grid w-full grid-cols-3 gap-3">
        <button
          type="button"
          @click="iniciar()"
          :disabled="rodando"
          class="card-frame flex flex-col items-center gap-1.5 rounded-xl border border-term-accent bg-term-accent py-3 text-sm font-medium text-term-bg shadow-md transition-colors disabled:pointer-events-none disabled:opacity-40">
          <!-- heroicons: play -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z" />
          </svg>
          <span x-text="decorridoAcumulado > 0 ? 'Retomar' : 'Iniciar'">Iniciar</span>
        </button>
        <button
          type="button"
          @click="pausar()"
          :disabled="!rodando"
          class="card-frame flex flex-col items-center gap-1.5 rounded-xl border border-term-border bg-term-alt py-3 text-sm font-medium text-term-fg shadow-md transition-colors hover:border-term-accent hover:text-term-accent disabled:pointer-events-none disabled:opacity-40">
          <!-- heroicons: pause -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25v13.5m-7.5-13.5v13.5" />
          </svg>
          Pausar
        </button>
        <button
          type="button"
          @click="reiniciar()"
          class="card-frame flex flex-col items-center gap-1.5 rounded-xl border border-term-border bg-term-alt py-3 text-sm font-medium text-term-fg shadow-md transition-colors hover:border-term-accent hover:text-term-accent">
          <!-- heroicons: arrow-path -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
          </svg>
          Reiniciar
        </button>
      </div>

    </section>

  </main>
</body>
</html>
