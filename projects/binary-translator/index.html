<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Binary Translator :: MicaelParise</title>
  <meta name="description" content="Converta texto em binário e binário em texto, direto no navegador.">

  <!-- tema salvo aplicado antes da primeira pintura (sincrono, evita flash) -->
  <script src="../../assets/js/tema.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="../../assets/js/tailwind-tema.js"></script>

  <link rel="stylesheet" href="../../assets/css/style.css">

  <!-- scripts com defer executam em ordem: compartilhado, projeto e por ultimo o Alpine -->
  <script src="../../assets/js/app.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
</head>
<body class="min-h-screen overflow-x-hidden bg-term-bg text-term-fg font-mono antialiased">
  <div class="scanlines" aria-hidden="true"></div>

  <div class="flex min-h-screen flex-col items-center justify-center px-4 pb-24 pt-10 sm:py-16">
    <header class="mb-8 text-center">
      <p class="text-sm text-term-dim">visitante@micaelparise:~$ binary --translate</p>
      <h1 class="mt-2 font-display text-3xl tracking-tight text-term-accent text-glow sm:text-4xl">Binary Translator</h1>
      <p class="mt-2 text-sm text-term-dim sm:text-base">
        Converta texto em binário e binário em texto, instantaneamente.
      </p>
    </header>

    <main
      x-data="converterApp()"
      x-cloak
      class="card-frame w-full max-w-4xl rounded-2xl border border-term-border bg-term-alt p-4 sm:p-8"
    >
      <div class="mb-6 flex justify-center">
        <div class="grid w-full max-w-sm grid-cols-2 gap-1 rounded-full border border-term-border bg-term-bg p-1" role="group" aria-label="Direção da conversão">
          <button
            type="button"
            @click="setMode('textToBinary')"
            :aria-pressed="mode === 'textToBinary'"
            :class="mode === 'textToBinary' ? 'bg-term-accent text-term-bg shadow' : 'text-term-dim hover:text-term-accent'"
            class="rounded-full px-3 py-2 text-center text-xs font-semibold transition-colors duration-200 sm:text-sm"
          >
            Texto → Binário
          </button>
          <button
            type="button"
            @click="setMode('binaryToText')"
            :aria-pressed="mode === 'binaryToText'"
            :class="mode === 'binaryToText' ? 'bg-term-accent text-term-bg shadow' : 'text-term-dim hover:text-term-accent'"
            class="rounded-full px-3 py-2 text-center text-xs font-semibold transition-colors duration-200 sm:text-sm"
          >
            Binário → Texto
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 gap-4 md:grid-cols-[1fr_auto_1fr] md:items-center">
        <div class="flex flex-col">
          <label for="entrada" class="mb-1 text-xs font-medium uppercase tracking-wide text-term-dim" x-text="inputLabel"></label>
          <textarea
            id="entrada"
            x-model="input"
            @input="convert()"
            :placeholder="inputPlaceholder"
            rows="6"
            spellcheck="false"
            class="w-full resize-none rounded-xl border border-term-border bg-term-bg p-3 text-sm text-term-fg placeholder:text-term-dim focus:outline-none focus:ring-2 focus:ring-term-accent"
          ></textarea>
        </div>

        <div class="flex justify-center md:flex-col">
          <button
            type="button"
            @click="swap()"
            title="Inverter direção"
            aria-label="Inverter direção da conversão"
            class="grid h-10 w-10 place-items-center rounded-full border border-term-border bg-term-bg text-term-fg transition-colors duration-200 hover:border-term-accent hover:bg-term-accent hover:text-term-bg"
          >
            <!-- heroicons: arrows-up-down (mobile) / arrows-right-left (desktop) -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5 md:hidden" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 7.5 7.5 3m0 0L12 7.5M7.5 3v13.5m13.5 0L16.5 21m0 0L12 16.5m4.5 4.5V7.5" />
            </svg>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="hidden h-5 w-5 md:block" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21 3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5" />
            </svg>
          </button>
        </div>

        <div class="flex flex-col">
          <div class="mb-1 flex items-center justify-between">
            <label for="saida" class="text-xs font-medium uppercase tracking-wide text-term-dim" x-text="outputLabel"></label>
            <button
              type="button"
              @click="copyOutput()"
              :disabled="!output"
              class="flex items-center gap-1 text-xs font-medium text-term-accent hover:text-glow disabled:cursor-not-allowed disabled:opacity-40"
            >
              <svg x-show="!copied" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 0 0-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 0 1-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H9.75" />
              </svg>
              <svg x-show="copied" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
              </svg>
              <span x-text="copied ? 'Copiado!' : 'Copiar'"></span>
            </button>
          </div>
          <textarea
            id="saida"
            :value="output"
            readonly
            :placeholder="outputPlaceholder"
            rows="6"
            class="w-full resize-none rounded-xl border border-term-border bg-term-bg p-3 text-sm text-term-soft placeholder:text-term-dim focus:outline-none"
          ></textarea>
        </div>
      </div>

      <p x-show="invalid" x-cloak class="mt-3 text-center text-xs text-term-danger">
        Alguns blocos foram ignorados: use apenas 0 e 1, em grupos de 8 bits separados por espaço.
      </p>

      <div class="mt-6 flex justify-center">
        <button
          type="button"
          @click="clear()"
          class="rounded-full border border-term-border px-6 py-2 text-sm font-semibold text-term-dim transition-colors duration-200 hover:border-term-accent hover:text-term-accent"
        >
          Limpar
        </button>
      </div>
    </main>
  </div>
</body>
</html>
