<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview PDF :: MicaelParise</title>
  <meta name="description" content="Visualize arquivos PDF direto no navegador, sem enviar nada a servidores.">

  <!-- tema salvo aplicado antes da primeira pintura (sincrono, evita flash) -->
  <script src="../../assets/js/tema.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="../../assets/js/tailwind-tema.js"></script>

  <link rel="stylesheet" href="../../assets/css/style.css">

  <!-- scripts com defer executam em ordem: compartilhado, projeto e por ultimo o Alpine -->
  <script src="../../assets/js/app.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
</head>
<body
  x-data="visualizadorPdf()"
  class="min-h-screen bg-term-bg text-term-fg font-mono antialiased"
>
  <div class="scanlines" aria-hidden="true"></div>

  <div class="mx-auto max-w-6xl px-4 pb-24 pt-10 md:px-8 md:py-14">

    <header class="mb-8 md:mb-10">
      <p class="text-sm text-term-dim">visitante@micaelparise:~$ open ./arquivo.pdf</p>
      <h1 class="mt-2 font-display text-3xl tracking-tight text-term-accent text-glow md:text-4xl">Preview PDF</h1>
      <p class="mt-1 text-term-dim">Escolha um arquivo no seu dispositivo para visualizar o conteúdo direto no navegador.</p>
    </header>

    <main class="grid grid-cols-1 gap-6 md:grid-cols-[360px_1fr] md:items-start">

      <section class="card-frame rounded-xl border border-term-border bg-term-alt p-6 shadow-lg">

        <!-- fica fora dos x-if para que $refs continue valido depois de carregar o arquivo -->
        <input x-ref="entradaArquivo" @change="selecionar($event)" type="file" accept="application/pdf,.pdf" class="hidden">

        <div
          x-show="!arquivo"
          @dragover.prevent="arrastando = true"
          @dragleave.prevent="arrastando = false"
          @drop.prevent="soltar($event)"
          :class="arrastando ? 'border-term-accent bg-term-bg' : 'border-term-border'"
          class="flex flex-col items-center gap-3 rounded-xl border-2 border-dashed px-4 py-10 text-center transition-colors"
        >
          <!-- heroicons: arrow-up-tray -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-10 w-10 text-term-accent" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />
          </svg>

          <p class="text-sm text-term-dim">Arraste um arquivo PDF até aqui ou</p>

          <button
            type="button"
            @click="$refs.entradaArquivo.click()"
            class="rounded-xl border border-term-accent bg-term-accent px-4 py-2 text-sm font-medium text-term-bg shadow-md transition hover:opacity-90"
          >
            Selecionar arquivo
          </button>
        </div>

        <p x-show="erro" x-cloak x-text="erro" role="alert" class="mt-3 text-center text-sm text-term-danger"></p>

        <div x-show="arquivo" x-cloak x-transition class="flex flex-col gap-4">
          <div class="flex items-start gap-3 rounded-xl border border-term-border bg-term-bg p-4">
            <!-- heroicons: document-text -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-8 w-8 shrink-0 text-term-accent" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
            </svg>
            <div class="min-w-0 flex-1">
              <p class="truncate text-sm font-medium" x-text="arquivo?.name"></p>
              <p class="text-xs text-term-dim" x-text="tamanho"></p>
            </div>
          </div>

          <a :href="urlArquivo" target="_blank" rel="noopener" class="flex items-center justify-center gap-2 rounded-xl border border-term-border px-4 py-2 text-sm font-medium transition hover:border-term-accent hover:text-term-accent">
            <!-- heroicons: arrow-top-right-on-square -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 0 0 3 8.25v10.5A2.25 2.25 0 0 0 5.25 21h10.5A2.25 2.25 0 0 0 18 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
            </svg>
            Abrir em nova guia
          </a>

          <button type="button" @click="remover()" class="flex items-center justify-center gap-2 rounded-xl border border-term-danger/40 px-4 py-2 text-sm font-medium text-term-danger transition hover:bg-term-danger/10">
            <!-- heroicons: x-mark -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
            </svg>
            Remover arquivo
          </button>
        </div>

      </section>

      <section class="card-frame overflow-hidden rounded-xl border border-term-border bg-term-alt shadow-lg">

        <div x-show="!arquivo" class="flex h-[50vh] flex-col items-center justify-center gap-3 p-6 text-center text-term-dim md:h-[70vh]">
          <!-- heroicons: document -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1" stroke="currentColor" class="h-12 w-12" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
          </svg>
          <p class="text-sm">A pré-visualização aparecerá aqui</p>
        </div>

        <!-- x-if recria o iframe a cada arquivo (trocar o src de um embed nao recarrega em todos os navegadores) -->
        <template x-if="urlArquivo">
          <iframe :src="urlArquivo" :title="`Pré-visualização de ${arquivo?.name}`" class="h-[50vh] w-full md:h-[70vh]"></iframe>
        </template>

      </section>

    </main>

  </div>
</body>
</html>
