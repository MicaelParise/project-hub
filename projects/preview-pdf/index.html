<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview PDF :: MicaelParise</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'%3E%3Cpath d='M6 2a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6H6z'/%3E%3C/svg%3E">

    <style>[x-cloak] { display: none !important; }</style>

    <script>
      (function () {
        var salvo = localStorage.getItem('tema');
        var escuro = salvo ? salvo === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', escuro);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              term: {
                bg: 'var(--term-bg)',
                alt: 'var(--term-bg-alt)',
                fg: 'var(--term-fg)',
                dim: 'var(--term-fg-dim)',
                accent: 'var(--term-accent)',
                border: 'var(--term-border)',
                soft: 'var(--term-fg-soft)',
                toggle: 'var(--term-toggle-bg)',
              },
            },
            fontFamily: {
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
              display: ['"Share Tech Mono"', 'ui-monospace', 'monospace'],
            },
          },
        },
      };
    </script>

    <link rel="stylesheet" href="../../assets/css/style.css">

    <script src="../../assets/js/app.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
</head>
<body
    x-data="visualizadorPdf()"
    class="bg-term-bg text-term-fg font-mono min-h-screen antialiased">

<div class="scanlines" aria-hidden="true"></div>

    <div class="mx-auto max-w-6xl px-4 py-10 md:px-8 md:py-14">

        <header class="mb-8 md:mb-10">
            <h1 class="text-2xl font-bold tracking-tight md:text-3xl">Preview PDF</h1>
            <p class="mt-1 text-term-dim">Escolha um arquivo no seu dispositivo para visualizar o conteúdo direto no navegador.</p>
        </header>

        <main class="grid grid-cols-1 gap-6 md:grid-cols-[360px_1fr] md:items-start">

            <section class="card-frame rounded-xl border border-term-border bg-term-alt p-6 shadow-lg">

                <template x-if="!arquivo">
                    <div
                        x-cloak
                        @dragover.prevent="arrastando = true"
                        @dragleave.prevent="arrastando = false"
                        @drop.prevent="soltar($event)"
                        :class="arrastando ? 'border-term-accent bg-term-bg' : 'border-term-border'"
                        class="flex flex-col items-center gap-3 rounded-xl border-2 border-dashed px-4 py-10 text-center transition-colors">

                        <svg class="h-10 w-10 text-term-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 8.25 12 3.75m0 0L7.5 8.25M12 3.75v12.75" />
                        </svg>

                        <p class="text-sm text-term-dim">Arraste um arquivo PDF até aqui ou</p>

                        <label class="cursor-pointer rounded-xl border border-term-border bg-term-accent px-4 py-2 text-sm font-medium text-term-bg shadow-md transition hover:opacity-90">
                            Selecionar arquivo
                            <input x-ref="entradaArquivo" @change="selecionar($event)" type="file" accept="application/pdf" class="hidden">
                        </label>
                    </div>
                </template>

                <template x-if="arquivo">
                    <div x-cloak x-transition class="flex flex-col gap-4">

                        <div class="flex items-start gap-3 rounded-xl border border-term-border bg-term-bg p-4">
                            <svg class="h-8 w-8 shrink-0 text-term-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
                            </svg>
                            <div class="min-w-0 flex-1">
                                <p class="truncate text-sm font-medium" x-text="arquivo.name"></p>
                                <p class="text-xs text-term-dim" x-text="tamanho()"></p>
                            </div>
                        </div>

                        <a :href="urlArquivo" target="_blank" rel="noopener" class="flex items-center justify-center gap-2 rounded-xl border border-term-border px-4 py-2 text-sm font-medium transition hover:border-term-accent hover:text-term-accent">
                            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 0 0 3 8.25v10.5A2.25 2.25 0 0 0 5.25 21h10.5A2.25 2.25 0 0 0 18 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" />
                            </svg>
                            Abrir em nova guia
                        </a>

                        <button @click="remover()" class="flex items-center justify-center gap-2 rounded-xl border border-red-500/40 px-4 py-2 text-sm font-medium text-red-500 transition hover:bg-red-500/10">
                            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                            </svg>
                            Remover arquivo
                        </button>
                    </div>
                </template>

            </section>

            <section class="card-frame overflow-hidden rounded-xl border border-term-border bg-term-alt shadow-lg">

                <div x-show="!arquivo" x-cloak class="flex h-[50vh] flex-col items-center justify-center gap-3 p-6 text-center text-term-dim md:h-[70vh]">
                    <svg class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
                    </svg>
                    <p class="text-sm">A pré-visualização aparecerá aqui</p>
                </div>

                <embed x-show="arquivo" x-cloak :src="urlArquivo" type="application/pdf" class="h-[50vh] w-full md:h-[70vh]">

            </section>

        </main>

    </div>

    <a href="../../index.html" aria-label="Voltar para o hub de projetos"
        class="fixed bottom-6 right-20 z-[1000] w-12 h-12 rounded-full border border-term-border bg-term-toggle backdrop-blur flex items-center justify-center shadow-lg text-term-fg hover:text-term-accent hover:border-term-accent transition-colors">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-6h5v6"/></svg>
    </a>

    <button
        type="button"
        x-data="themeToggle()"
        x-on:click="toggle()"
        class="theme-toggle fixed bottom-6 right-6 z-[1000] w-12 h-12 rounded-full border border-term-accent bg-term-toggle backdrop-blur flex items-center justify-center shadow-lg text-term-accent hover:text-glow"
        aria-label="Alternar entre tema claro e escuro">
        <svg class="icon-sun w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="4.4" y1="4.4" x2="6.1" y2="6.1"/><line x1="17.9" y1="17.9" x2="19.6" y2="19.6"/><line x1="4.4" y1="19.6" x2="6.1" y2="17.9"/><line x1="17.9" y1="6.1" x2="19.6" y2="4.4"/></svg>
        <svg class="icon-moon w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg>
    </button>

</body>
</html>
