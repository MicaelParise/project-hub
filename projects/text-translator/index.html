<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Translator :: MicaelParise</title>
  <meta name="description" content="Traduza texto entre mais de 90 idiomas, com opções de ouvir e copiar.">

  <!-- tema salvo aplicado antes da primeira pintura (sincrono, evita flash) -->
  <script src="../../assets/js/tema.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="../../assets/js/tailwind-tema.js"></script>

  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="css/estilos.css">

  <!-- scripts com defer executam em ordem: compartilhado, dados, projeto e por ultimo o Alpine -->
  <script src="../../assets/js/app.js" defer></script>
  <script src="js/idiomas.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
</head>
<body class="min-h-screen bg-term-bg text-term-fg font-mono antialiased">
  <div class="scanlines" aria-hidden="true"></div>

  <div x-data="tradutor()" class="flex min-h-screen flex-col">
    <header class="mx-auto flex w-full max-w-5xl items-center gap-3 px-4 pb-6 pt-8 sm:px-8">
      <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl bg-term-accent text-term-bg shadow-md">
        <!-- heroicons: language -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-6 w-6" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="m10.5 21 5.25-11.25L21 21m-9-3h7.5M3 5.621a48.474 48.474 0 0 1 6-.371m0 0c1.12 0 2.233.038 3.334.114M9 5.25V3m3.334 2.364C11.176 10.658 7.69 15.08 3 17.502m9.334-12.138c.896.061 1.785.147 2.666.257m-4.589 8.495a18.023 18.023 0 0 1-3.827-5.802" />
        </svg>
      </div>
      <div>
        <h1 class="font-display text-xl leading-tight text-term-accent text-glow sm:text-2xl">Text Translator</h1>
        <p class="text-sm text-term-dim">Traduza rapidamente entre mais de 90 idiomas</p>
      </div>
    </header>

    <main class="mx-auto w-full max-w-5xl flex-1 px-4 pb-24 sm:px-8">
      <div class="relative flex flex-col gap-4 md:flex-row">
        <section class="card-frame flex flex-1 flex-col overflow-hidden rounded-xl border border-term-border bg-term-alt">
          <div class="flex items-center gap-2 border-b border-term-border px-4 py-3">
            <select
              x-model="idiomaOrigem"
              aria-label="Idioma de origem"
              class="min-w-0 flex-1 cursor-pointer truncate bg-transparent text-sm font-medium text-term-fg outline-none sm:text-base [&>option]:bg-term-alt"
            >
              <template x-for="[codigo, nome] in listaIdiomas" :key="codigo">
                <option :value="codigo" x-text="nome" :selected="codigo === idiomaOrigem"></option>
              </template>
            </select>
            <div class="flex shrink-0 items-center gap-1">
              <button
                type="button"
                @click="falar('origem')"
                title="Ouvir texto"
                aria-label="Ouvir texto original"
                class="flex h-8 w-8 items-center justify-center rounded-lg text-term-dim transition-colors hover:bg-term-bg hover:text-term-accent"
              >
                <!-- heroicons: speaker-wave -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 0 1 0 12.728M16.463 8.288a5.25 5.25 0 0 1 0 7.424M6.75 8.25l4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.009 9.009 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z" />
                </svg>
              </button>
              <button
                type="button"
                @click="copiar('origem')"
                title="Copiar texto"
                aria-label="Copiar texto original"
                class="relative flex h-8 w-8 items-center justify-center rounded-lg text-term-dim transition-colors hover:bg-term-bg hover:text-term-accent"
              >
                <!-- heroicons: document-duplicate -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 0 0-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 0 1-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H9.75" />
                </svg>
                <span
                  x-cloak
                  x-show="copiadoOrigem"
                  x-transition
                  role="status"
                  class="absolute -bottom-8 right-0 z-10 whitespace-nowrap rounded-lg border border-term-border bg-term-alt px-2 py-1 text-xs font-medium text-term-fg shadow-md"
                >Copiado!</span>
              </button>
            </div>
          </div>
          <textarea
            x-model="textoOrigem"
            @keydown.ctrl.enter.prevent="traduzir()"
            @keydown.meta.enter.prevent="traduzir()"
            spellcheck="false"
            placeholder="Digite o texto"
            aria-label="Texto original"
            maxlength="500"
            class="min-h-[180px] flex-1 resize-none bg-transparent p-4 font-mono text-base text-term-fg outline-none placeholder:text-term-dim sm:text-lg md:min-h-[300px]"
          ></textarea>
          <p class="px-4 pb-2 text-right text-xs text-term-dim" x-text="`${textoOrigem.length}/500 · Ctrl+Enter traduz`"></p>
        </section>

        <button
          type="button"
          @click="trocarIdiomas()"
          title="Trocar idiomas"
          aria-label="Trocar idiomas"
          class="absolute left-1/2 top-1/2 z-10 hidden h-11 w-11 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full border border-term-border bg-term-alt text-term-accent shadow-md transition-transform hover:scale-105 hover:border-term-accent active:scale-95 md:flex"
        >
          <!-- heroicons: arrows-right-left -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21 3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5" />
          </svg>
        </button>

        <div class="relative z-10 -my-2 flex justify-center md:hidden">
          <button
            type="button"
            @click="trocarIdiomas()"
            title="Trocar idiomas"
            aria-label="Trocar idiomas"
            class="flex h-10 w-10 items-center justify-center rounded-full border border-term-border bg-term-alt text-term-accent shadow-md transition-transform active:scale-95"
          >
            <!-- heroicons: arrows-up-down -->
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 7.5 7.5 3m0 0L12 7.5M7.5 3v13.5m13.5 0L16.5 21m0 0L12 16.5m4.5 4.5V7.5" />
            </svg>
          </button>
        </div>

        <section class="card-frame flex flex-1 flex-col overflow-hidden rounded-xl border border-term-border bg-term-alt">
          <div class="flex items-center gap-2 border-b border-term-border px-4 py-3">
            <select
              x-model="idiomaDestino"
              aria-label="Idioma de destino"
              class="min-w-0 flex-1 cursor-pointer truncate bg-transparent text-sm font-medium text-term-fg outline-none sm:text-base [&>option]:bg-term-alt"
            >
              <template x-for="[codigo, nome] in listaIdiomas" :key="codigo">
                <option :value="codigo" x-text="nome" :selected="codigo === idiomaDestino"></option>
              </template>
            </select>
            <div class="flex shrink-0 items-center gap-1">
              <button
                type="button"
                @click="falar('destino')"
                title="Ouvir tradução"
                aria-label="Ouvir tradução"
                class="flex h-8 w-8 items-center justify-center rounded-lg text-term-dim transition-colors hover:bg-term-bg hover:text-term-accent"
              >
                <!-- heroicons: speaker-wave -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 0 1 0 12.728M16.463 8.288a5.25 5.25 0 0 1 0 7.424M6.75 8.25l4.72-4.72a.75.75 0 0 1 1.28.53v15.88a.75.75 0 0 1-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.009 9.009 0 0 1 2.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75Z" />
                </svg>
              </button>
              <button
                type="button"
                @click="copiar('destino')"
                title="Copiar tradução"
                aria-label="Copiar tradução"
                class="relative flex h-8 w-8 items-center justify-center rounded-lg text-term-dim transition-colors hover:bg-term-bg hover:text-term-accent"
              >
                <!-- heroicons: document-duplicate -->
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4" aria-hidden="true">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 0 0-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 0 1-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H9.75" />
                </svg>
                <span
                  x-cloak
                  x-show="copiadoDestino"
                  x-transition
                  role="status"
                  class="absolute -bottom-8 right-0 z-10 whitespace-nowrap rounded-lg border border-term-border bg-term-alt px-2 py-1 text-xs font-medium text-term-fg shadow-md"
                >Copiado!</span>
              </button>
            </div>
          </div>
          <div class="relative flex-1">
            <textarea
              readonly
              :value="textoDestino"
              placeholder="Tradução"
              aria-label="Tradução"
              aria-live="polite"
              class="h-full min-h-[180px] w-full resize-none bg-transparent p-4 font-mono text-base text-term-fg outline-none placeholder:text-term-dim sm:text-lg md:min-h-[300px]"
            ></textarea>
            <div
              x-cloak
              x-show="traduzindo"
              class="absolute inset-0 flex items-center justify-center gap-2 bg-term-alt/80 text-sm text-term-dim backdrop-blur-sm"
            >
              <!-- heroicons: arrow-path -->
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4 animate-spin" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
              </svg>
              Traduzindo...
            </div>
          </div>
        </section>
      </div>

      <p x-show="erro" x-cloak x-text="erro" role="alert" class="mt-4 text-center text-sm text-term-danger"></p>

      <button
        type="button"
        @click="traduzir()"
        :disabled="traduzindo || !textoOrigem.trim()"
        class="mt-6 flex w-full items-center justify-center gap-2 rounded-xl bg-term-accent px-8 py-3.5 font-medium text-term-bg shadow-md transition-colors hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-60 sm:mx-auto sm:w-auto sm:min-w-[220px]"
      >
        <!-- heroicons: paper-airplane -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5" />
        </svg>
        <span x-text="traduzindo ? 'Traduzindo...' : 'Traduzir texto'">Traduzir texto</span>
      </button>
    </main>

    <footer class="pb-8 text-center text-xs text-term-dim">
      Tradução via <a href="https://mymemory.translated.net/" target="_blank" rel="noopener noreferrer" class="text-term-accent hover:text-glow">MyMemory API</a>
    </footer>
  </div>
</body>
</html>
