<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Translator :: MicaelParise</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'%3E%3Crect width='24' height='24' rx='6'/%3E%3Ctext x='12' y='16' font-size='11' text-anchor='middle' fill='white' font-family='Arial'%3EAあ%3C/text%3E%3C/svg%3E" />

    <style>
      [x-cloak] { display: none !important; }
    </style>

    <!-- resolve o tema de forma sincrona, antes de qualquer pintura, evitando FOUC -->
    <script>
      (function () {
        var salvo = localStorage.getItem('tema');
        var escuro = salvo ? salvo === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', escuro);
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              term: {
                bg: 'var(--term-bg)',
                alt: 'var(--term-bg-alt)',
                fg: 'var(--term-fg)',
                dim: 'var(--term-fg-dim)',
                accent: 'var(--term-accent)',
                border: 'var(--term-border)',
                soft: 'var(--term-fg-soft)',
                toggle: 'var(--term-toggle-bg)',
              },
            },
            fontFamily: {
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
              display: ['"Share Tech Mono"', 'ui-monospace', 'monospace'],
            },
          },
        },
      };
    </script>

    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="css/estilos.css" />

    <!-- assets/js/app.js precisa carregar antes do Alpine para registrar o listener de 'alpine:init' a tempo -->
    <script src="../../assets/js/app.js" defer></script>
  </head>
  <body class="min-h-screen bg-term-bg text-term-fg font-mono">
    <div class="scanlines" aria-hidden="true"></div>

    <div x-data="tradutor()" class="min-h-screen flex flex-col">
      <header class="w-full max-w-5xl mx-auto px-4 sm:px-8 pt-8 pb-6 flex items-center gap-3">
        <div class="h-11 w-11 shrink-0 rounded-xl bg-term-accent text-term-bg flex items-center justify-center shadow-md">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor" class="h-6 w-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 8.511c.884.284 1.5 1.128 1.5 2.097v4.286c0 1.136-.847 2.1-1.98 2.193-.34.027-.68.052-1.02.072v3.091l-3-3c-1.354 0-2.694-.055-4.02-.163a2.115 2.115 0 0 1-.825-.242m9.345-8.334a2.126 2.126 0 0 0-.476-.095 48.64 48.64 0 0 0-8.048 0c-1.131.094-1.976 1.057-1.976 2.192v4.286c0 .837.46 1.58 1.155 1.951m9.345-8.334V6.637c0-1.621-1.152-3.026-2.76-3.235A48.455 48.455 0 0 0 11.25 3c-2.115 0-4.198.137-6.24.402-1.608.209-2.76 1.614-2.76 3.235v6.226c0 1.621 1.152 3.026 2.76 3.235.577.075 1.157.14 1.74.194V21l4.155-4.155" />
          </svg>
        </div>
        <div>
          <h1 class="text-lg sm:text-xl font-semibold leading-tight">Text Translator</h1>
          <p class="text-sm text-term-dim">Traduza rapidamente entre mais de 90 idiomas</p>
        </div>
      </header>

      <main class="flex-1 w-full max-w-5xl mx-auto px-4 sm:px-8 pb-24">
        <div class="relative flex flex-col md:flex-row gap-4">
          <section class="flex-1 flex flex-col card-frame border border-term-border bg-term-alt rounded-xl overflow-hidden">
            <div class="flex items-center gap-2 px-4 py-3 border-b border-term-border">
              <select
                x-model="idiomaOrigem"
                class="flex-1 min-w-0 truncate bg-transparent font-medium text-sm sm:text-base outline-none cursor-pointer text-term-fg"
              >
                <template x-for="[codigo, nome] in Object.entries(idiomas)" :key="codigo">
                  <option :value="codigo" x-text="nome"></option>
                </template>
              </select>
              <div class="flex items-center gap-1 shrink-0">
                <button
                  @click="falar('origem')"
                  title="Ouvir texto"
                  class="h-8 w-8 flex items-center justify-center rounded-lg text-term-dim hover:text-term-accent hover:bg-term-bg transition-colors"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor" class="h-4 w-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 0 1 0 12.728M16.463 8.288a5.25 5.25 0 0 1 0 7.424M6.75 8.25H4.5a.75.75 0 0 0-.75.75v6c0 .414.336.75.75.75h2.25l4.72 4.72a.75.75 0 0 0 1.28-.53V4.06a.75.75 0 0 0-1.28-.53l-4.72 4.72Z" />
                  </svg>
                </button>
                <button
                  @click="copiar('origem')"
                  title="Copiar texto"
                  class="relative h-8 w-8 flex items-center justify-center rounded-lg text-term-dim hover:text-term-accent hover:bg-term-bg transition-colors"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor" class="h-4 w-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3a2.25 2.25 0 0 0-2.166 1.638m7.332 0c.055.194.084.4.084.612a.75.75 0 0 1-.75.75H9a.75.75 0 0 1-.75-.75c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.21 48.21 0 0 1 1.927-.184" />
                  </svg>
                  <span
                    x-cloak
                    x-show="copiadoOrigem"
                    x-transition
                    class="absolute -bottom-8 right-0 whitespace-nowrap rounded-lg border border-term-border bg-term-alt px-2 py-1 text-xs font-medium shadow-md text-term-fg"
                    >Copiado!</span
                  >
                </button>
              </div>
            </div>
            <textarea
              x-model="textoOrigem"
              @keyup="limparDestinoSeVazio"
              spellcheck="false"
              placeholder="Digite o texto"
              class="flex-1 min-h-[180px] md:min-h-[300px] resize-none bg-transparent p-4 outline-none font-mono text-term-fg text-base sm:text-lg placeholder:text-term-dim"
            ></textarea>
          </section>

          <button
            @click="trocarIdiomas"
            title="Trocar idiomas"
            class="hidden md:flex absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 z-10 h-11 w-11 items-center justify-center rounded-full border border-term-border bg-term-alt shadow-md text-term-accent hover:scale-105 hover:text-glow active:scale-95 transition-transform"
          >
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor" class="h-5 w-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21 3 16.5m0 0L7.5 12M3 16.5h18M16.5 3 21 7.5m0 0L16.5 12M21 7.5H3" />
            </svg>
          </button>

          <div class="flex md:hidden justify-center -my-2 relative z-10">
            <button
              @click="trocarIdiomas"
              title="Trocar idiomas"
              class="h-10 w-10 flex items-center justify-center rounded-full border border-term-border bg-term-alt shadow-md text-term-accent active:scale-95 transition-transform"
            >
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor" class="h-5 w-5 rotate-90">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21 3 16.5m0 0L7.5 12M3 16.5h18M16.5 3 21 7.5m0 0L16.5 12M21 7.5H3" />
              </svg>
            </button>
          </div>

          <section class="flex-1 flex flex-col card-frame border border-term-border bg-term-alt rounded-xl overflow-hidden">
            <div class="flex items-center gap-2 px-4 py-3 border-b border-term-border">
              <select
                x-model="idiomaDestino"
                class="flex-1 min-w-0 truncate bg-transparent font-medium text-sm sm:text-base outline-none cursor-pointer text-term-fg"
              >
                <template x-for="[codigo, nome] in Object.entries(idiomas)" :key="codigo">
                  <option :value="codigo" x-text="nome"></option>
                </template>
              </select>
              <div class="flex items-center gap-1 shrink-0">
                <button
                  @click="falar('destino')"
                  title="Ouvir tradução"
                  class="h-8 w-8 flex items-center justify-center rounded-lg text-term-dim hover:text-term-accent hover:bg-term-bg transition-colors"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor" class="h-4 w-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 0 1 0 12.728M16.463 8.288a5.25 5.25 0 0 1 0 7.424M6.75 8.25H4.5a.75.75 0 0 0-.75.75v6c0 .414.336.75.75.75h2.25l4.72 4.72a.75.75 0 0 0 1.28-.53V4.06a.75.75 0 0 0-1.28-.53l-4.72 4.72Z" />
                  </svg>
                </button>
                <button
                  @click="copiar('destino')"
                  title="Copiar tradução"
                  class="relative h-8 w-8 flex items-center justify-center rounded-lg text-term-dim hover:text-term-accent hover:bg-term-bg transition-colors"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor" class="h-4 w-4">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0 0 13.5 2.25h-3a2.25 2.25 0 0 0-2.166 1.638m7.332 0c.055.194.084.4.084.612a.75.75 0 0 1-.75.75H9a.75.75 0 0 1-.75-.75c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 0 1-2.25 2.25H6.75A2.25 2.25 0 0 1 4.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.21 48.21 0 0 1 1.927-.184" />
                  </svg>
                  <span
                    x-cloak
                    x-show="copiadoDestino"
                    x-transition
                    class="absolute -bottom-8 right-0 whitespace-nowrap rounded-lg border border-term-border bg-term-alt px-2 py-1 text-xs font-medium shadow-md text-term-fg"
                    >Copiado!</span
                  >
                </button>
              </div>
            </div>
            <div class="relative flex-1">
              <textarea
                readonly
                x-model="textoDestino"
                placeholder="Tradução"
                class="w-full h-full min-h-[180px] md:min-h-[300px] resize-none bg-transparent p-4 outline-none font-mono text-term-fg text-base sm:text-lg placeholder:text-term-dim"
              ></textarea>
              <div
                x-cloak
                x-show="traduzindo"
                class="absolute inset-0 flex items-center justify-center gap-2 bg-term-alt/80 backdrop-blur-sm text-sm text-term-dim"
              >
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor" class="h-4 w-4 animate-spin">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
                </svg>
                Traduzindo...
              </div>
            </div>
          </section>
        </div>

        <button
          @click="traduzir"
          :disabled="traduzindo"
          class="mt-6 w-full sm:w-auto sm:mx-auto sm:min-w-[220px] flex items-center justify-center gap-2 rounded-xl bg-term-accent hover:opacity-90 disabled:opacity-60 disabled:cursor-not-allowed text-term-bg font-medium py-3.5 px-8 shadow-md transition-colors"
        >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.6" stroke="currentColor" class="h-5 w-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.126A59.77 59.77 0 0 1 21.485 12 59.77 59.77 0 0 1 3.27 20.876L5.999 12Zm0 0h7.5" />
          </svg>
          <span x-text="traduzindo ? 'Traduzindo...' : 'Traduzir texto'"></span>
        </button>
      </main>

      <footer class="text-center text-xs text-term-dim pb-8">
        Tradução via MyMemory API
      </footer>
    </div>

    <!-- BOTAO VOLTAR AO HUB -->
    <a
      href="../../index.html"
      aria-label="Voltar para o hub de projetos"
      class="fixed bottom-6 right-20 z-[1000] w-12 h-12 rounded-full border border-term-border bg-term-toggle backdrop-blur flex items-center justify-center shadow-lg text-term-fg hover:text-term-accent hover:border-term-accent transition-colors"
    >
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-6h5v6"/></svg>
    </a>

    <!-- TOGGLE DE TEMA -->
    <button
      type="button"
      x-data="themeToggle()"
      x-on:click="toggle()"
      class="theme-toggle fixed bottom-6 right-6 z-[1000] w-12 h-12 rounded-full border border-term-accent bg-term-toggle backdrop-blur flex items-center justify-center shadow-lg text-term-accent hover:text-glow"
      aria-label="Alternar entre tema claro e escuro"
    >
      <svg class="icon-sun w-5 h-5" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.7"/><g stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="4.4" y1="4.4" x2="6.1" y2="6.1"/><line x1="17.9" y1="17.9" x2="19.6" y2="19.6"/><line x1="4.4" y1="19.6" x2="6.1" y2="17.9"/><line x1="17.9" y1="6.1" x2="19.6" y2="4.4"/></g></svg>
      <svg class="icon-moon w-5 h-5" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" d="M20.5 14.5A8.5 8.5 0 1 1 9.5 3.5a7 7 0 0 0 11 11z"/></svg>
    </button>

    <script src="js/idiomas.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  </body>
</html>
