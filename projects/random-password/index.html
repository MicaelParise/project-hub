<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Password :: MicaelParise</title>
  <meta name="description" content="Gere senhas fortes e aleatórias direto no navegador.">

  <!-- tema salvo aplicado antes da primeira pintura (sincrono, evita flash) -->
  <script src="../../assets/js/tema.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="../../assets/js/tailwind-tema.js"></script>

  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="css/styles.css">

  <!-- scripts com defer executam em ordem: compartilhado, projeto e por ultimo o Alpine -->
  <script src="../../assets/js/app.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
</head>
<body class="min-h-screen bg-term-bg text-term-fg font-mono antialiased">
  <div class="scanlines" aria-hidden="true"></div>

  <main class="flex min-h-screen items-center justify-center p-4 pb-24 sm:p-6">
    <div class="w-full max-w-md">

      <div class="mb-6 text-center sm:mb-8 sm:text-left">
        <p class="text-sm text-term-dim">visitante@micaelparise:~$ passwd --random</p>
        <h1 class="mt-2 font-display text-3xl tracking-tight text-term-accent text-glow sm:text-4xl">Random Password</h1>
        <p class="mt-1 text-sm text-term-dim">Crie senhas fortes e aleatórias em um clique.</p>
      </div>

      <div x-data="appSenha()" class="card-frame rounded-xl border border-term-border bg-term-alt p-5 shadow-lg sm:p-6">

        <div class="flex items-center gap-2 rounded-xl border border-term-border bg-term-bg px-4 py-3">
          <span x-text="senha" class="flex-1 select-all truncate font-mono text-base tracking-wide text-term-accent text-glow sm:text-lg" aria-label="Senha gerada"></span>

          <button type="button" @click="copiar()" class="relative shrink-0 rounded-lg p-2 text-term-dim transition-colors hover:bg-term-alt hover:text-term-accent" aria-label="Copiar senha">
            <!-- heroicons: document-duplicate / check -->
            <svg x-show="!copiado" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 0 1-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 0 1 1.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 0 0-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 0 1-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 0 0-3.375-3.375h-1.5a1.125 1.125 0 0 1-1.125-1.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H9.75" />
            </svg>
            <svg x-show="copiado" x-cloak xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5 text-term-accent" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
            </svg>
          </button>
        </div>

        <button type="button" @click="gerar()" class="mt-4 flex w-full items-center justify-center gap-2 rounded-xl bg-term-accent py-3 font-semibold text-term-bg shadow-md transition-colors hover:opacity-90 active:opacity-80">
          <!-- heroicons: arrow-path -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99" />
          </svg>
          Gerar nova senha
        </button>

        <div class="mt-4 flex items-center justify-between text-xs text-term-dim">
          <span x-text="`${tamanho} caracteres · letras, números e símbolos`"></span>
          <span x-show="copiado" x-cloak class="font-medium text-term-accent" role="status">Copiado!</span>
        </div>

      </div>
    </div>
  </main>
</body>
</html>
