<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player :: MicaelParise</title>
  <meta name="description" content="Player de música web com playlist, repetição e modo aleatório.">
  <meta name="theme-color" content="#0a0e0a">

  <!-- tema salvo aplicado antes da primeira pintura (sincrono, evita flash) -->
  <script src="../../assets/js/tema.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <!-- favicons -->
  <link rel="icon" href="assets/icons/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="manifest" href="assets/icons/site.webmanifest">

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="../../assets/js/tailwind-tema.js"></script>

  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- scripts com defer executam em ordem: compartilhado, dados, player e por ultimo o Alpine -->
  <script src="../../assets/js/app.js" defer></script>
  <script src="assets/js/songs.js" defer></script>
  <script src="assets/js/player.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
</head>
<body class="h-dvh w-full overflow-hidden bg-term-bg text-term-fg font-mono antialiased">
  <div class="scanlines" aria-hidden="true"></div>

  <!-- init() e chamado automaticamente pelo Alpine (nao repetir em x-init) -->
  <div x-data="musicPlayer()" @keydown.escape.window="showList = false; showInfo = false" class="flex h-full w-full flex-col lg:flex-row">

    <!-- sidebar: lista de musicas -->
    <!-- desktop (lg+): coluna fixa sempre visivel, ao lado do player -->
    <!-- mobile/tablet: painel em tela cheia, aberto/fechado pelo botao de fila -->
    <aside
      class="w-full shrink-0 flex-col border-term-border bg-term-alt p-4 backdrop-blur lg:flex lg:w-80 lg:border-r lg:p-6 xl:w-96"
      :class="showList ? 'fixed inset-0 z-30 flex' : 'hidden'"
      aria-label="Lista de músicas"
    >
      <div class="mb-4 flex shrink-0 items-center justify-between">
        <div class="flex items-center gap-2 text-term-fg">
          <!-- heroicons: queue-list -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-6 w-6 text-term-accent" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h16.5m-16.5 3.75h16.5M3.75 19.5h16.5M5.625 4.5h12.75a1.875 1.875 0 0 1 0 3.75H5.625a1.875 1.875 0 0 1 0-3.75Z" />
          </svg>
          <span class="font-medium">Lista de músicas</span>
        </div>

        <button type="button" @click="showList = false" class="text-term-dim transition hover:text-term-accent lg:hidden" aria-label="Fechar lista">
          <!-- heroicons: x-mark -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-6 w-6" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <ul class="no-scrollbar min-h-0 flex-1 space-y-1 overflow-y-auto pr-1">
        <template x-for="(song, i) in songs" :key="i">
          <li>
            <button
              type="button"
              @click="selectSong(i); showList = false"
              :aria-current="i === index"
              class="flex w-full items-center justify-between gap-3 rounded-xl px-3 py-2 text-left transition"
              :class="i === index ? 'bg-term-bg text-term-accent pointer-events-none' : 'text-term-dim hover:bg-term-bg hover:text-term-accent'"
            >
              <span class="min-w-0">
                <span class="block truncate text-sm" :class="i === index && 'font-semibold'" x-text="song.name"></span>
                <span class="block truncate text-xs text-term-dim" x-text="song.artist"></span>
              </span>

              <span class="shrink-0 text-xs text-term-dim" x-text="i === index ? 'Tocando' : (durations[i] || '--:--')"></span>
            </button>
          </li>
        </template>
      </ul>
    </aside>

    <!-- player principal -->
    <main class="relative flex min-h-0 flex-1 flex-col items-center justify-center gap-5 overflow-hidden p-6 pb-24 lg:gap-6 lg:p-12">

      <!-- info -->
      <button type="button" @click="showInfo = !showInfo" class="absolute right-5 top-5 text-term-dim transition hover:text-term-accent" title="Sobre" aria-label="Sobre o player" :aria-expanded="showInfo">
        <!-- heroicons: information-circle -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-6 w-6" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z" />
        </svg>
      </button>

      <div
        x-show="showInfo"
        x-transition
        x-cloak
        @click.outside="showInfo = false"
        class="card-frame absolute right-5 top-14 z-10 w-64 max-w-[80vw] rounded-xl border border-term-border bg-term-alt p-3 text-xs text-term-dim backdrop-blur"
      >
        Feito com <span class="text-term-accent">&#9829;</span> para ouvir suas músicas favoritas.
      </div>

      <span class="shrink-0 text-xs font-medium uppercase tracking-widest text-term-accent">Tocando agora</span>

      <!-- capa da musica -->
      <div class="card-frame aspect-square w-[min(70vw,42vh,26rem)] shrink-0 overflow-hidden rounded-3xl border border-term-border bg-term-alt shadow-2xl">
        <img :src="imgSrc" @error="onImgError($event)" :alt="`Capa de ${current.name}`" class="h-full w-full object-cover">
      </div>

      <!-- nome / artista -->
      <div class="card-frame w-full max-w-md shrink-0 rounded-xl border border-term-border bg-term-alt px-4 py-3 text-center">
        <p class="truncate text-xl font-semibold lg:text-2xl" x-text="current.name"></p>
        <p class="mt-1 truncate text-sm text-term-dim lg:text-base" x-text="current.artist"></p>
      </div>

      <!-- audio real (invisivel) -->
      <audio
        x-ref="audio"
        preload="metadata"
        @timeupdate="currentTime = $refs.audio.currentTime"
        @loadedmetadata="duration = $refs.audio.duration"
        @play="playing = true"
        @pause="playing = false"
        @ended="onEnded()"
        class="hidden"
      ></audio>

      <!-- barra de progresso -->
      <div class="w-full max-w-md shrink-0">
        <div
          @click="seek($event)"
          @keydown.right.prevent="skipBy(5)"
          @keydown.left.prevent="skipBy(-5)"
          role="slider"
          tabindex="0"
          aria-label="Progresso da música"
          aria-valuemin="0"
          :aria-valuemax="Math.floor(duration)"
          :aria-valuenow="Math.floor(currentTime)"
          :aria-valuetext="`${formatTime(currentTime)} de ${formatTime(duration)}`"
          class="group relative h-1.5 cursor-pointer rounded-full bg-term-alt"
        >
          <div class="h-full rounded-full bg-term-accent" :style="`width:${progressPercent}%`"></div>
          <div
            class="absolute top-1/2 h-3 w-3 -translate-y-1/2 scale-0 rounded-full bg-term-fg shadow transition group-hover:scale-100 group-focus-visible:scale-100"
            :style="`left:calc(${progressPercent}% - 6px)`"
          ></div>
        </div>

        <div class="mt-2 flex justify-between text-xs text-term-dim">
          <span x-text="formatTime(currentTime)"></span>
          <span x-text="formatTime(duration)"></span>
        </div>
      </div>

      <!-- controles -->
      <div class="card-frame flex w-full max-w-md shrink-0 items-center justify-between rounded-xl border border-term-border bg-term-alt px-4 py-3">
        <button type="button" @click="cycleRepeat()" :title="repeatTitle" :aria-label="repeatTitle" class="relative text-term-dim transition hover:text-term-accent">
          <!-- heroicons: arrow-path-rounded-square (playlist/uma musica) e arrows-right-left (aleatorio) -->
          <svg x-show="repeatMode !== 'shuffle'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-6 w-6" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12c0-1.232-.046-2.453-.138-3.662a4.006 4.006 0 0 0-3.7-3.7 48.678 48.678 0 0 0-7.324 0 4.006 4.006 0 0 0-3.7 3.7c-.017.22-.032.441-.046.662M19.5 12l3-3m-3 3-3-3m-12 3c0 1.232.046 2.453.138 3.662a4.006 4.006 0 0 0 3.7 3.7 48.656 48.656 0 0 0 7.324 0 4.006 4.006 0 0 0 3.7-3.7c.017-.22.032-.441.046-.662M4.5 12l3 3m-3-3-3 3" />
          </svg>
          <svg x-show="repeatMode === 'shuffle'" x-cloak xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-6 w-6" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21 3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5" />
          </svg>
          <span x-show="repeatMode === 'one'" x-cloak class="absolute -right-1.5 -top-1.5 flex h-4 w-4 items-center justify-center rounded-full bg-term-accent text-[10px] font-bold leading-none text-term-bg" aria-hidden="true">1</span>
        </button>

        <button type="button" @click="prev()" class="text-term-fg transition hover:text-term-accent" aria-label="Música anterior">
          <!-- heroicons: backward (solid) -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-9 w-9" aria-hidden="true">
            <path d="M9.195 18.44c1.25.714 2.805-.189 2.805-1.629v-2.34l6.945 3.968c1.25.715 2.805-.188 2.805-1.628V8.69c0-1.44-1.555-2.343-2.805-1.628L12 11.029v-2.34c0-1.44-1.555-2.343-2.805-1.628l-7.108 4.061c-1.26.72-1.26 2.536 0 3.256l7.108 4.061Z" />
          </svg>
        </button>

        <button
          type="button"
          @click="togglePlay()"
          :aria-label="playing ? 'Pausar' : 'Tocar'"
          class="flex h-14 w-14 items-center justify-center rounded-full bg-term-accent text-term-bg shadow-lg transition hover:brightness-110 active:scale-95"
        >
          <!-- heroicons: play / pause (solid) -->
          <svg x-show="!playing" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="ml-0.5 h-7 w-7" aria-hidden="true">
            <path fill-rule="evenodd" d="M4.5 5.653c0-1.427 1.529-2.33 2.779-1.643l11.54 6.347c1.295.712 1.295 2.573 0 3.286L7.28 19.99c-1.25.687-2.779-.217-2.779-1.643V5.653Z" clip-rule="evenodd" />
          </svg>
          <svg x-show="playing" x-cloak xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-7 w-7" aria-hidden="true">
            <path fill-rule="evenodd" d="M6.75 5.25a.75.75 0 0 1 .75-.75H9a.75.75 0 0 1 .75.75v13.5a.75.75 0 0 1-.75.75H7.5a.75.75 0 0 1-.75-.75V5.25Zm7.5 0A.75.75 0 0 1 15 4.5h1.5a.75.75 0 0 1 .75.75v13.5a.75.75 0 0 1-.75.75H15a.75.75 0 0 1-.75-.75V5.25Z" clip-rule="evenodd" />
          </svg>
        </button>

        <button type="button" @click="next()" class="text-term-fg transition hover:text-term-accent" aria-label="Próxima música">
          <!-- heroicons: forward (solid) -->
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-9 w-9" aria-hidden="true">
            <path d="M5.055 7.06C3.805 6.347 2.25 7.25 2.25 8.69v8.122c0 1.44 1.555 2.343 2.805 1.628L12 14.471v2.34c0 1.44 1.555 2.343 2.805 1.628l7.108-4.061c1.26-.72 1.26-2.536 0-3.256l-7.108-4.061C13.555 6.346 12 7.249 12 8.689v2.34L5.055 7.061Z" />
          </svg>
        </button>

        <button type="button" @click="showList = !showList" class="text-term-dim transition hover:text-term-accent lg:pointer-events-none lg:invisible" aria-label="Abrir lista de músicas">
          <!-- heroicons: queue-list -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-6 w-6" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 12h16.5m-16.5 3.75h16.5M3.75 19.5h16.5M5.625 4.5h12.75a1.875 1.875 0 0 1 0 3.75H5.625a1.875 1.875 0 0 1 0-3.75Z" />
          </svg>
        </button>
      </div>

    </main>

  </div>
</body>
</html>
