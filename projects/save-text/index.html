<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Save Text :: MicaelParise</title>
  <meta name="description" content="Salve qualquer texto como arquivo direto do navegador.">

  <!-- tema salvo aplicado antes da primeira pintura (sincrono, evita flash) -->
  <script src="../../assets/js/tema.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="../../assets/js/tailwind-tema.js"></script>

  <link rel="stylesheet" href="../../assets/css/style.css">

  <!-- scripts com defer executam em ordem: compartilhado, projeto e por ultimo o Alpine -->
  <script src="../../assets/js/app.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
</head>
<body class="min-h-screen bg-term-bg text-term-fg font-mono antialiased">
  <div class="scanlines" aria-hidden="true"></div>

  <main
    x-data="salvarTexto()"
    class="mx-auto flex min-h-screen max-w-5xl flex-col justify-center gap-10 px-5 pb-24 pt-10 md:flex-row md:items-center md:gap-14 md:px-8 md:py-10"
  >
    <section class="md:w-2/5">
      <span class="inline-flex items-center gap-2 rounded-full border border-term-border bg-term-alt px-3 py-1 text-xs font-medium text-term-accent">
        <!-- heroicons: cloud-arrow-up -->
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-3.5 w-3.5" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5V9.75m0 0 3 3m-3-3-3 3M6.75 19.5a4.5 4.5 0 0 1-1.41-8.775 5.25 5.25 0 0 1 10.233-2.33 3 3 0 0 1 3.758 3.848A3.752 3.752 0 0 1 18 19.5H6.75Z" />
        </svg>
        Sem instalação, sem servidor, na web
      </span>

      <p class="mt-6 text-sm text-term-dim">visitante@micaelparise:~$ save-text</p>
      <h1 class="mt-2 font-display text-3xl leading-tight text-term-accent text-glow md:text-4xl">
        Salve qualquer texto direto no seu computador<span class="cursor-blink" aria-hidden="true">&nbsp;</span>
      </h1>
      <p class="mt-3 text-term-soft">
        Escreva ou cole o conteúdo, escolha o formato do arquivo e baixe tudo em um clique.
        Nenhum dado sai do seu navegador.
      </p>

      <ul class="mt-6 hidden flex-wrap gap-2 md:flex" x-cloak>
        <template x-for="item in formatos" :key="item.mime">
          <li
            class="rounded-lg border px-2.5 py-1 text-xs font-medium transition"
            :class="item.mime === formato
              ? 'border-term-accent bg-term-accent text-term-bg'
              : 'border-term-border bg-term-alt text-term-dim'"
            x-text="'.' + item.extensao"
          ></li>
        </template>
      </ul>
    </section>

    <section class="md:w-3/5">
      <form @submit.prevent="salvar()" class="card-frame rounded-xl border border-term-border bg-term-alt p-5 shadow-xl sm:p-7">
        <label for="conteudo" class="mb-2 block text-sm font-medium text-term-dim">Conteúdo</label>
        <textarea
          id="conteudo"
          x-model="conteudo"
          spellcheck="false"
          placeholder="Digite algo para salvar"
          class="h-56 w-full resize-none rounded-xl border border-term-border bg-term-bg p-3.5 font-mono text-[15px] leading-relaxed text-term-fg outline-none transition placeholder:text-term-dim focus:border-term-accent"
        ></textarea>

        <div class="mt-4 grid gap-4 sm:grid-cols-2">
          <div>
            <label for="nome-arquivo" class="mb-2 block text-sm font-medium text-term-dim">Nome do arquivo</label>
            <input
              id="nome-arquivo"
              x-model="nomeArquivo"
              type="text"
              spellcheck="false"
              autocomplete="off"
              placeholder="meu-arquivo"
              class="h-12 w-full rounded-xl border border-term-border bg-term-bg px-3.5 font-mono text-[15px] text-term-fg outline-none transition placeholder:text-term-dim focus:border-term-accent"
            >
          </div>
          <div>
            <label for="formato" class="mb-2 block text-sm font-medium text-term-dim">Salvar como</label>
            <select
              id="formato"
              x-model="formato"
              class="h-12 w-full rounded-xl border border-term-border bg-term-bg px-3.5 font-mono text-[15px] text-term-fg outline-none transition focus:border-term-accent"
            >
              <template x-for="item in formatos" :key="item.mime">
                <option :value="item.mime" x-text="item.rotulo"></option>
              </template>
            </select>
          </div>
        </div>

        <button
          type="submit"
          :disabled="!podeSalvar"
          class="mt-5 flex w-full items-center justify-center gap-2 rounded-xl bg-term-accent py-3.5 font-mono font-medium text-term-bg shadow-lg transition hover:brightness-110 disabled:cursor-not-allowed disabled:opacity-50 disabled:hover:brightness-100"
        >
          <!-- heroicons: arrow-down-tray -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-5 w-5" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3" />
          </svg>
          <span x-text="`Salvar como .${formatoAtual.extensao}`">Salvar</span>
        </button>

        <p
          x-cloak
          x-show="mostrarAviso"
          x-transition
          role="status"
          class="mt-4 flex items-center gap-2 rounded-xl border border-term-accent bg-term-bg px-3.5 py-2.5 text-sm font-medium text-term-accent"
        >
          <!-- heroicons: check -->
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-4 w-4 shrink-0" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
          </svg>
          Arquivo salvo com sucesso.
        </p>
      </form>
    </section>
  </main>
</body>
</html>
