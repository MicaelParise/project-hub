<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clock :: MicaelParise</title>
  <meta name="description" content="Relógio ao vivo com saudação conforme o período do dia.">

  <!-- tema salvo aplicado antes da primeira pintura (sincrono, evita flash) -->
  <script src="../../assets/js/tema.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="../../assets/js/tailwind-tema.js"></script>

  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="stylesheet" href="css/styles.css">

  <!-- scripts com defer executam em ordem: compartilhado, projeto e por ultimo o Alpine -->
  <script src="../../assets/js/app.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js" defer></script>
</head>
<body class="relative min-h-screen overflow-x-hidden bg-term-bg text-term-fg font-mono antialiased">
  <div class="scanlines" aria-hidden="true"></div>

  <main
    x-data="relogio()"
    class="relative z-10 mx-auto flex min-h-screen w-full max-w-5xl flex-col items-center justify-center gap-10 px-5 pb-24 pt-14 lg:flex-row lg:items-center lg:justify-between lg:gap-10 lg:px-10 lg:py-14"
  >
    <section class="flex flex-col items-center gap-4 text-center lg:items-start lg:text-left">
      <div class="card-frame flex items-center gap-2 rounded-full border border-term-border bg-term-alt px-4 py-2">
        <!-- heroicons: sun (manha), sun solid (tarde), cloud (entardecer), moon (noite) -->
        <span class="h-5 w-5 text-term-accent" aria-hidden="true">
          <svg x-show="periodo.icone === 'manha'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-full w-full">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
          </svg>
          <svg x-show="periodo.icone === 'tarde'" x-cloak xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-full w-full">
            <path d="M12 2.25a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0V3a.75.75 0 0 1 .75-.75ZM7.5 12a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM18.894 6.166a.75.75 0 0 0-1.06-1.06l-1.591 1.59a.75.75 0 1 0 1.06 1.061l1.591-1.59ZM21.75 12a.75.75 0 0 1-.75.75h-2.25a.75.75 0 0 1 0-1.5H21a.75.75 0 0 1 .75.75ZM17.834 18.894a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 1 0-1.061 1.06l1.59 1.591ZM12 18a.75.75 0 0 1 .75.75V21a.75.75 0 0 1-1.5 0v-2.25A.75.75 0 0 1 12 18ZM7.758 17.303a.75.75 0 0 0-1.061-1.06l-1.591 1.59a.75.75 0 0 0 1.06 1.061l1.591-1.59ZM6 12a.75.75 0 0 1-.75.75H3a.75.75 0 0 1 0-1.5h2.25A.75.75 0 0 1 6 12ZM6.697 7.757a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 0 0-1.061 1.06l1.59 1.591Z" />
          </svg>
          <svg x-show="periodo.icone === 'entardecer'" x-cloak xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-full w-full">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15a4.5 4.5 0 0 0 4.5 4.5H18a3.75 3.75 0 0 0 1.332-7.257 3 3 0 0 0-3.758-3.848 5.25 5.25 0 0 0-10.233 2.33A4.502 4.502 0 0 0 2.25 15Z" />
          </svg>
          <svg x-show="periodo.icone === 'noite'" x-cloak xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="h-full w-full">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
          </svg>
        </span>
        <span class="text-sm font-semibold tracking-wide text-term-soft" x-text="periodo.nome">Carregando</span>
      </div>

      <p class="text-sm text-term-dim">visitante@micaelparise:~$ date</p>
      <h1 class="font-display text-4xl text-term-accent text-glow md:text-6xl">
        <span x-text="periodo.saudacao">Olá</span><span class="cursor-blink" aria-hidden="true">&nbsp;</span>
      </h1>

      <p class="max-w-sm text-sm text-term-dim md:text-base">
        Relógio ao vivo com saudação conforme o período do dia.
      </p>
    </section>

    <section aria-label="Relógio" class="card-frame flex items-center gap-2 rounded-xl border border-term-border bg-term-alt p-4 sm:gap-3 sm:p-6">
      <div class="flex flex-col items-center">
        <span class="font-display text-glow text-3xl leading-none text-term-accent tabular-nums sm:text-5xl md:text-6xl lg:text-7xl" x-text="horas">00</span>
        <span class="mt-2 text-[10px] font-semibold uppercase tracking-widest text-term-dim sm:text-xs">Horas</span>
      </div>

      <span class="separador-relogio font-display text-glow text-3xl text-term-accent sm:text-5xl md:text-6xl lg:text-7xl" aria-hidden="true">:</span>

      <div class="flex flex-col items-center">
        <span class="font-display text-glow text-3xl leading-none text-term-accent tabular-nums sm:text-5xl md:text-6xl lg:text-7xl" x-text="minutos">00</span>
        <span class="mt-2 text-[10px] font-semibold uppercase tracking-widest text-term-dim sm:text-xs">Minutos</span>
      </div>

      <span class="separador-relogio font-display text-glow text-3xl text-term-accent sm:text-5xl md:text-6xl lg:text-7xl" aria-hidden="true">:</span>

      <div class="flex flex-col items-center">
        <span class="font-display text-glow text-3xl leading-none text-term-accent tabular-nums sm:text-5xl md:text-6xl lg:text-7xl" x-text="segundos">00</span>
        <span class="mt-2 text-[10px] font-semibold uppercase tracking-widest text-term-dim sm:text-xs">Segundos</span>
      </div>
    </section>
  </main>
</body>
</html>
